<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mi Mercadito - Catálogo</title>
  <link rel="manifest" id="dynamicManifest">
  <meta name="theme-color" content="#1e4a76">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mi Mercadito">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f5f8fc; padding: 12px; overflow-x: hidden; }
    .app { max-width: 1200px; margin: 0 auto; }
    
    /* Header */
    header { background: #1e4a76; color: white; padding: 0.8rem 1rem; border-radius: 20px; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .logo-area { display: flex; align-items: center; gap: 12px; }
    .logo-icon { font-size: 2rem; background: rgba(255,255,255,0.2); width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    h1 { font-size: 1.3rem; }
    .menu-icon { font-size: 1.8rem; cursor: pointer; background: none; border: none; color: white; }
    
    /* Menú */
    .menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; display: none; }
    .menu-overlay.show { display: block; }
    .menu-lateral { position: fixed; top: 0; left: -300px; width: 280px; height: 100%; background: white; z-index: 1000; transition: left 0.3s ease; box-shadow: 2px 0 8px rgba(0,0,0,0.2); overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 8px; }
    .menu-lateral.show { left: 0; }
    .menu-lateral button { width: 100%; padding: 12px; text-align: center; }
    
    /* Barra de búsqueda */
    .search-section { margin-bottom: 1rem; }
    .search-box { width: 100%; padding: 14px 20px; border-radius: 48px; border: 1px solid #cde3f5; font-size: 1rem; background: white; }
    
    /* Filtros */
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; }
    .filter-chip { background: #e8f0fe; padding: 6px 14px; border-radius: 30px; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
    .filter-chip.active { background: #1e4a76; color: white; }
    
    /* Información de estado */
    .info-bar { background: #e8f0fe; padding: 10px 16px; border-radius: 30px; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 0.85rem; }
    .btn-small { background: #2c6e9e; color: white; padding: 6px 12px; border-radius: 30px; font-size: 0.8rem; cursor: pointer; border: none; }
    .btn-warning { background: #e67e22; color: white; }
    .btn-success { background: #27ae60; color: white; }
    
    /* Grid de productos */
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .product-card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); transition: transform 0.2s; border: 1px solid #e0ecf5; }
    .product-card:active { transform: scale(0.98); }
    .product-img { width: 100%; height: 200px; background: #f0f4f8; display: flex; align-items: center; justify-content: center; font-size: 4rem; }
    .product-img img { width: 100%; height: 100%; object-fit: cover; }
    .product-info { padding: 12px; }
    .product-name { font-weight: bold; font-size: 1.1rem; margin-bottom: 4px; }
    .product-category { font-size: 0.75rem; color: #6c9ebf; margin-bottom: 8px; }
    .product-price { font-size: 1.4rem; font-weight: bold; color: #1e4a76; margin: 8px 0; }
    .product-price small { font-size: 0.8rem; font-weight: normal; color: #e67e22; }
    .stock-info { font-size: 0.75rem; color: #27ae60; margin-bottom: 8px; }
    .btn-pedir { background: #25D366; color: white; width: 100%; padding: 10px; border-radius: 30px; font-weight: bold; border: none; cursor: pointer; transition: opacity 0.2s; }
    .btn-pedir:active { opacity: 0.8; }
    
    /* Modal de carga */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1100; }
    .modal-content { background: white; padding: 1.5rem; border-radius: 24px; width: 90%; max-width: 350px; text-align: center; }
    .modal-content input { width: 100%; padding: 10px; margin: 12px 0; border-radius: 30px; border: 1px solid #cde3f5; }
    .modal-buttons { display: flex; gap: 10px; margin-top: 1rem; justify-content: center; }
    
    .empty-state { text-align: center; padding: 40px; color: #6c9ebf; }
    .banner-instalacion { position: fixed; bottom: 0; left: 0; right: 0; background: #1e4a76; color: white; text-align: center; padding: 12px; z-index: 1100; transform: translateY(100%); transition: transform 0.3s ease; display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; }
    .banner-instalacion.show { transform: translateY(0); }
    .banner-instalacion button { background: #27ae60; color: white; padding: 8px 20px; border: none; border-radius: 30px; }
    
    button { cursor: pointer; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #e8f0fe; }
    ::-webkit-scrollbar-thumb { background: #2c6e9e; border-radius: 10px; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo-area">
      <div class="logo-icon">🛒</div>
      <h1>Mi Mercadito Catálogo</h1>
    </div>
    <button class="menu-icon" id="menuIcon">☰</button>
  </header>

  <div id="iosBanner" class="banner-instalacion">
    <span>📲 Para instalar: Compartir → "Añadir a pantalla de inicio"</span>
    <button id="closeBannerBtn">✕</button>
  </div>

  <div class="menu-overlay" id="menuOverlay"></div>
  <div class="menu-lateral" id="menuLateral">
    <button id="btnCargarArchivo" class="btn-success">📂 Cargar desde archivo</button>
    <button id="btnCargarURL" class="btn-small">🌐 Cargar desde URL (GitHub)</button>
    <button id="btnEjemplo" class="btn-warning">📦 Cargar productos ejemplo</button>
    <hr style="margin: 8px 0;">
    <button id="btnInstalarApp" class="btn-success" style="display:none;">📲 Instalar App</button>
    <button id="btnCerrarMenu" class="btn-small">✕ Cerrar</button>
  </div>

  <!-- Contenido principal -->
  <div class="search-section">
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Buscar producto... (nombre, categoría)" autocomplete="off">
  </div>
  
  <div class="filters" id="filtersContainer"></div>
  
  <div class="info-bar" id="infoBar">
    <span>📦 <span id="productosCount">0</span> productos disponibles</span>
    <button id="btnActualizar" class="btn-small">🔄 Actualizar</button>
  </div>
  
  <div id="productsContainer" class="products-grid">
    <div class="empty-state">📂 Carga un archivo de inventario para ver los productos</div>
  </div>

  <!-- Modal para cargar URL -->
  <div id="modalURL" class="modal">
    <div class="modal-content">
      <h3>🌐 Cargar desde URL</h3>
      <input type="text" id="urlInput" placeholder="https://.../resguardo.json">
      <div class="modal-buttons">
        <button id="btnConfirmarURL" class="btn-success">Cargar</button>
        <button id="btnCancelarURL" class="btn-small">Cancelar</button>
      </div>
    </div>
  </div>
</div>

<script>
  // ====================== MANIFEST DINÁMICO ======================
  function createDynamicManifest() {
    const manifest = {
      name: "Mi Mercadito Catálogo",
      short_name: "Mercadito",
      description: "Catálogo de productos para clientes",
      start_url: ".",
      display: "standalone",
      theme_color: "#1e4a76",
      background_color: "#f5f8fc",
      orientation: "portrait",
      icons: [{ src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231e4a76'/%3E%3Ctext x='50' y='67' font-size='50' text-anchor='middle' fill='white'%3E🛒%3C/text%3E%3C/svg%3E", sizes: "any", type: "image/svg+xml" }]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    const manifestURL = URL.createObjectURL(manifestBlob);
    document.getElementById('dynamicManifest').setAttribute('href', manifestURL);
  }
  createDynamicManifest();

  // ====================== SERVICE WORKER EMBEBIDO ======================
  function registerEmbeddedServiceWorker() {
    const swCode = `
      const CACHE_NAME = 'mercadito-catalogo-v1';
      self.addEventListener('install', event => {
        event.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(['.', 'catalogo.html'])));
      });
      self.addEventListener('fetch', event => {
        event.respondWith(fetch(event.request).catch(() => caches.match(event.request).then(response => response || caches.match('.'))));
      });
    `;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    const swURL = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swURL).then(() => URL.revokeObjectURL(swURL));
  }

  // ====================== ESTADO GLOBAL ======================
  let productos = [];           // Lista de productos activos (stock > 0)
  let productosRaw = [];        // Todos los productos del JSON
  let categoriaSeleccionada = "Todas";
  let textoBusqueda = "";
  
  // Almacenamiento en localStorage
  const STORAGE_KEY = 'catalogo_productos';
  
  function guardarProductosLocal() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(productosRaw));
  }
  
  function cargarProductosLocal() {
    const guardado = localStorage.getItem(STORAGE_KEY);
    if (guardado) {
      productosRaw = JSON.parse(guardado);
      filtrarYMostrar();
      return true;
    }
    return false;
  }
  
  // Procesar JSON del POS (formato: { productos: [...], ventas: ... })
  function procesarJSON(data) {
    if (data.productos && Array.isArray(data.productos)) {
      productosRaw = data.productos.map(p => ({
        id: p.id,
        nombre: p.nombre || "Sin nombre",
        categoria: p.categoria || "General",
        precioVenta: p.precioVenta || 0,
        cantidad: p.cantidad || 0,
        costo: p.costo || 0,
        // Para fotos: si el JSON ya tiene base64, usarlo; si no, null
        fotoBase64: p.fotoBase64 || null
      }));
      guardarProductosLocal();
      filtrarYMostrar();
      return true;
    }
    return false;
  }
  
  // Cargar productos de ejemplo (para probar)
  function cargarEjemplo() {
    productosRaw = [
      { id: 1, nombre: "Coca Cola 600ml", categoria: "Bebidas", precioVenta: 18, cantidad: 10, costo: 12, fotoBase64: null },
      { id: 2, nombre: "Papas Fritas", categoria: "Snacks", precioVenta: 15, cantidad: 3, costo: 8, fotoBase64: null },
      { id: 3, nombre: "Sandwich Pollo", categoria: "Comidas", precioVenta: 35, cantidad: 5, costo: 20, fotoBase64: null },
      { id: 4, nombre: "Agua Mineral", categoria: "Bebidas", precioVenta: 10, cantidad: 0, costo: 5, fotoBase64: null },
      { id: 5, nombre: "Galletas Oreo", categoria: "Snacks", precioVenta: 12, cantidad: 2, costo: 6, fotoBase64: null }
    ];
    guardarProductosLocal();
    filtrarYMostrar();
    alert("✅ Productos de ejemplo cargados (los agotados no se muestran)");
  }
  
  // Filtrar productos (solo stock > 0, por búsqueda y categoría)
  function filtrarYMostrar() {
    let filtrados = productosRaw.filter(p => p.cantidad > 0);
    
    // Filtro por búsqueda
    if (textoBusqueda.trim() !== "") {
      const busq = textoBusqueda.toLowerCase();
      filtrados = filtrados.filter(p => 
        p.nombre.toLowerCase().includes(busq) || 
        p.categoria.toLowerCase().includes(busq)
      );
    }
    
    // Filtro por categoría
    if (categoriaSeleccionada !== "Todas") {
      filtrados = filtrados.filter(p => p.categoria === categoriaSeleccionada);
    }
    
    productos = filtrados;
    renderizarProductos();
    renderizarCategorias();
    actualizarInfoBar();
  }
  
  // Extraer categorías únicas
  function obtenerCategorias() {
    const cats = new Set(productosRaw.filter(p => p.cantidad > 0).map(p => p.categoria));
    return ["Todas", ...Array.from(cats).sort()];
  }
  
  function renderizarCategorias() {
    const categorias = obtenerCategorias();
    const container = document.getElementById('filtersContainer');
    container.innerHTML = categorias.map(cat => 
      `<span class="filter-chip ${cat === categoriaSeleccionada ? 'active' : ''}" data-categoria="${cat}">${cat}</span>`
    ).join('');
    
    document.querySelectorAll('.filter-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        categoriaSeleccionada = chip.dataset.categoria;
        filtrarYMostrar();
      });
    });
  }
  
  function actualizarInfoBar() {
    document.getElementById('productosCount').innerText = productos.length;
  }
  
  // Renderizar productos en grid
  function renderizarProductos() {
    const container = document.getElementById('productsContainer');
    if (productos.length === 0) {
      container.innerHTML = '<div class="empty-state">📭 No hay productos disponibles. Carga un inventario o ajusta los filtros.</div>';
      return;
    }
    
    container.innerHTML = productos.map(p => {
      const precioNormal = p.precioVenta;
      const precioDelivery = (p.precioVenta * 1.1).toFixed(2);
      
      // Determinar imagen (fotoBase64 o emoji fallback)
      let imagenHtml = '';
      if (p.fotoBase64 && p.fotoBase64.startsWith('data:image')) {
        imagenHtml = `<img src="${p.fotoBase64}" alt="${p.nombre}">`;
      } else {
        // Emoji según categoría
        const emojiMap = { 'Bebidas': '🥤', 'Snacks': '🍿', 'Comidas': '🍔', 'General': '🛒' };
        const emoji = emojiMap[p.categoria] || '🛒';
        imagenHtml = `<div style="font-size: 4rem;">${emoji}</div>`;
      }
      
      return `
        <div class="product-card">
          <div class="product-img">${imagenHtml}</div>
          <div class="product-info">
            <div class="product-name">${escapeHtml(p.nombre)}</div>
            <div class="product-category">${escapeHtml(p.categoria)}</div>
            <div class="product-price">
              $${precioNormal.toFixed(2)}
              <small>+10% delivery: $${precioDelivery}</small>
            </div>
            <div class="stock-info">📦 Stock: ${p.cantidad} unidades</div>
            <button class="btn-pedir" data-nombre="${escapeHtml(p.nombre)}" data-precio-normal="${precioNormal}" data-precio-delivery="${precioDelivery}">
              🛵 Pedir por WhatsApp
            </button>
          </div>
        </div>
      `;
    }).join('');
    
    // Asignar eventos a los botones de pedido
    document.querySelectorAll('.btn-pedir').forEach(btn => {
      btn.addEventListener('click', () => {
        const nombre = btn.dataset.nombre;
        const precioNormal = btn.dataset.precioNormal;
        const precioDelivery = btn.dataset.precioDelivery;
        abrirWhatsApp(nombre, precioNormal, precioDelivery);
      });
    });
  }
  
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
  
  function abrirWhatsApp(nombre, precioNormal, precioDelivery) {
    const telefono = ""; // Deja vacío para que el cliente elija contacto o pon tu número ej: "521234567890"
    const mensaje = `Hola, me interesa este producto de su catálogo:
      
📦 Producto: ${nombre}
💰 Precio en tienda: $${parseFloat(precioNormal).toFixed(2)}
🛵 Precio a domicilio (+10%): $${parseFloat(precioDelivery).toFixed(2)}

¿Podrían confirmarme disponibilidad y forma de pago?`;
    
    const url = `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;
    window.open(url, '_blank');
  }
  
  // ====================== CARGA DE ARCHIVOS ======================
  function cargarDesdeArchivo(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (procesarJSON(data)) {
          alert("✅ Inventario cargado correctamente");
        } else {
          alert("❌ El archivo no tiene el formato esperado (falta 'productos')");
        }
      } catch(err) {
        alert("❌ Error al leer el archivo: " + err.message);
      }
    };
    reader.readAsText(file);
  }
  
  function cargarDesdeURL(url) {
    fetch(url)
      .then(res => {
        if (!res.ok) throw new Error("No se pudo descargar el archivo");
        return res.json();
      })
      .then(data => {
        if (procesarJSON(data)) {
          alert("✅ Inventario cargado desde URL");
          document.getElementById('modalURL').style.display = 'none';
        } else {
          alert("❌ El archivo no tiene el formato esperado");
        }
      })
      .catch(err => alert("❌ Error: " + err.message));
  }
  
  // ====================== MENÚ Y UI ======================
  function toggleMenu() {
    document.getElementById('menuLateral').classList.toggle('show');
    document.getElementById('menuOverlay').classList.toggle('show');
  }
  
  document.getElementById('menuIcon').onclick = () => toggleMenu();
  document.getElementById('menuOverlay').onclick = () => toggleMenu();
  document.getElementById('btnCerrarMenu').onclick = () => toggleMenu();
  document.getElementById('closeBannerBtn').onclick = () => {
    document.getElementById('iosBanner').classList.remove('show');
    localStorage.setItem('catalogoBannerClosed', 'true');
  };
  
  document.getElementById('btnCargarArchivo').onclick = () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = (e) => {
      if (e.target.files[0]) cargarDesdeArchivo(e.target.files[0]);
      toggleMenu();
    };
    input.click();
  };
  
  document.getElementById('btnCargarURL').onclick = () => {
    document.getElementById('modalURL').style.display = 'flex';
    toggleMenu();
  };
  
  document.getElementById('btnConfirmarURL').onclick = () => {
    const url = document.getElementById('urlInput').value.trim();
    if (url) cargarDesdeURL(url);
    else alert("Ingresa una URL válida");
  };
  
  document.getElementById('btnCancelarURL').onclick = () => {
    document.getElementById('modalURL').style.display = 'none';
    document.getElementById('urlInput').value = '';
  };
  
  document.getElementById('btnEjemplo').onclick = () => {
    cargarEjemplo();
    toggleMenu();
  };
  
  document.getElementById('btnActualizar').onclick = () => {
    if (cargarProductosLocal()) {
      alert("✅ Datos recargados desde el almacenamiento local");
    } else {
      alert("📂 No hay datos guardados. Carga un archivo primero.");
    }
  };
  
  document.getElementById('searchInput').addEventListener('input', (e) => {
    textoBusqueda = e.target.value;
    filtrarYMostrar();
  });
  
  // ====================== INSTALACIÓN PWA ======================
  function verificarInstalacion() {
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
    const bannerClosed = localStorage.getItem('catalogoBannerClosed') === 'true';
    if (isIOS && !isStandalone && !bannerClosed) {
      setTimeout(() => document.getElementById('iosBanner').classList.add('show'), 1000);
    }
  }
  
  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('btnInstalarApp').style.display = 'block';
  });
  
  document.getElementById('btnInstalarApp').onclick = () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
    }
  };
  
  // ====================== INICIALIZACIÓN ======================
  document.addEventListener('DOMContentLoaded', () => {
    if (!cargarProductosLocal()) {
      // Si no hay datos, mostrar mensaje amigable
      document.getElementById('productsContainer').innerHTML = '<div class="empty-state">📂 ¡Bienvenido! Usa el menú ☰ para cargar el catálogo desde un archivo o URL</div>';
    }
    verificarInstalacion();
    if ('serviceWorker' in navigator) registerEmbeddedServiceWorker();
  });
</script>
</body>
</html>
